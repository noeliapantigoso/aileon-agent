# Self-hosted deployment: a Raspberry Pi, a small VM, or any machine with Docker.
#
#   docker compose up -d
#
# Telegram runs in polling mode here, because TELEGRAM_WEBHOOK_URL is unset —
# no public URL, no port forwarding, no dynamic DNS needed.

services:
  aileon:
    build:
      context: .
      # Set explicitly so the same command works from an x86 laptop building
      # for a Pi: docker buildx build --platform linux/arm64
      platforms:
        - linux/arm64
        - linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_BACKEND: sqlite
      SQLITE_PATH: /data/aileon.db
    volumes:
      # Everything the agent knows lives in this one file. Back it up.
      - ./data:/data
      # Google Calendar's OAuth token, if you use the planner.
      - ./token.json:/app/token.json:ro
    ports:
      - "8080:8080"

  # The hourly cycle: cron skills, due reminders and the proactive wake-up.
  # Replaces Cloud Scheduler. Runs inside the compose network, so the endpoint
  # never has to be exposed to the internet.
  tick:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [aileon]
    env_file: .env
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while true; do
               sleep $$(( 3600 - $$(date +%s) % 3600 ));
               curl -fsS -X POST http://aileon:8080/api/v1/tick
                    -H \"X-Proactive-Secret: $$PROACTIVE_SECRET\" || true;
             done"
